[tox]
env_list = format, lint, type, test
no_package = true

[testenv]
dependency_groups = dev
setenv =
    PYTHONPATH = {toxinidir}:{toxinidir}/.scratch/hermes-agent
commands = pytest {posargs}

[testenv:format]
dependency_groups = dev
commands = ruff format --check src tests

[testenv:lint]
dependency_groups = dev
commands = ruff check src tests

[testenv:type]
dependency_groups = dev
commands = mypy src

[testenv:test]
dependency_groups = dev
commands = pytest {posargs}
