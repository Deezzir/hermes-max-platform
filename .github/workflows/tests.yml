name: Quality Checks

on:
  push:
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out plugin
        uses: actions/checkout@v7
      - name: Check out Hermes Agent dependency
        uses: actions/checkout@v7
        with:
          repository: NousResearch/hermes-agent
          ref: 6564f319a647b47de391cab2f608660323804a2b
          path: .scratch/hermes-agent
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Set up UV
        uses: astral-sh/setup-uv@v9.0.0
      - name: Install development dependencies
        run: uv sync --group dev
      - name: Run lint checks
        run: uv run tox -e lint

  unit:
    name: Unit Tests and Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Check out plugin
        uses: actions/checkout@v7
      - name: Check out Hermes Agent dependency
        uses: actions/checkout@v7
        with:
          repository: NousResearch/hermes-agent
          ref: 6564f319a647b47de391cab2f608660323804a2b
          path: .scratch/hermes-agent
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Set up UV
        uses: astral-sh/setup-uv@v9.0.0
      - name: Install development dependencies
        run: uv sync --group dev
      - name: Run unit tests
        run: uv run tox -e unit
